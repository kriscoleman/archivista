scalar Time

"""
PredicateType represents a unique predicate type from in-toto statements.
"""
type PredicateType {
  """
  The predicate type URI (e.g., "https://in-toto.io/attestation/vulns/v0.1").
  """
  value: String!
  """
  The number of statements using this predicate type.
  """
  count: Int!
}

"""
A connection to a list of PredicateType items.
"""
type PredicateTypeConnection {
  """
  A list of edges.
  """
  edges: [PredicateTypeEdge]
  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!
  """
  Identifies the total count of unique predicate types.
  """
  totalCount: Int!
}

"""
An edge in a PredicateType connection.
"""
type PredicateTypeEdge {
  """
  The predicate type at the end of the edge.
  """
  node: PredicateType
  """
  A cursor for use in pagination.
  """
  cursor: Cursor!
}

"""
PredicateTypeWhereInput is used for filtering PredicateType results.
"""
input PredicateTypeWhereInput {
  """
  Filter by exact predicate value.
  """
  value: String
  """
  Filter by predicate prefix.
  """
  valueHasPrefix: String
  """
  Filter by predicate suffix.
  """
  valueHasSuffix: String
  """
  Filter by predicate containing substring.
  """
  valueContains: String
}

extend type Query {
  """
  Query for unique predicate types stored in the system.
  Returns a paginated list of distinct predicate type URIs from all statements.
  """
  predicateTypes(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: Cursor

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: Cursor

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    Filtering options for PredicateTypes returned from the connection.
    """
    where: PredicateTypeWhereInput
  ): PredicateTypeConnection!
}
